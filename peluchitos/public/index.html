<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peluchitos - Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-4">
    <h2 class="mb-1">Nuestros peluches 🧸</h2>
    <p class="text-muted">Elige tu compañero favorito y agrégalo al carrito.</p>
    <div class="row g-3" id="catalogo"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let usuario = null;

    async function cargar() {
      usuario = await cargarNav();
      const productos = await api('/api/productos');
      const cont = document.getElementById('catalogo');
      if (!productos.length) { cont.innerHTML = '<p>No hay productos disponibles.</p>'; return; }

      cont.innerHTML = productos.map(p => `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card h-100 p-3">
            <div class="peluche-emoji">${esc(p.emoji)}</div>
            <h5 class="mt-2">${esc(p.nombre)}</h5>
            <p class="small text-muted flex-grow-1">${esc(p.descripcion)}</p>
            <div class="fw-bold">${q(p.precio)}</div>
            <div class="small mb-2 ${p.stock <= 5 ? 'stock-bajo' : 'text-muted'}">
              ${p.stock > 0 ? (p.stock <= 5 ? `¡Solo quedan ${p.stock}!` : `${p.stock} disponibles`) : 'Agotado'}
            </div>
            <button class="btn btn-primary btn-sm" data-id="${p.id}" ${p.stock === 0 ? 'disabled' : ''}>Agregar al carrito</button>
          </div>
        </div>`).join('');

      cont.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => agregar(b.dataset.id));
    }

    async function agregar(id) {
      if (!usuario) { location.href = '/login.html'; return; }
      if (usuario.rol === 'admin') { aviso('El administrador no puede comprar.', 'warning'); return; }
      try {
        await api('/api/carrito', 'POST', { producto_id: Number(id), cantidad: 1 });
        aviso('Agregado al carrito 🛒');
      } catch (e) { aviso(e.message, 'danger'); }
    }

    cargar();
  </script>
</body>
</html>
