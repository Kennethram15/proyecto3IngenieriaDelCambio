<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peluchitos - Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-4">
    <h2 class="mb-3">Tu carrito 🛒</h2>
    <div id="vacio" class="alert alert-info d-none">Tu carrito está vacío. <a href="/index.html">Ir al catálogo</a></div>

    <div class="row g-4 d-none" id="contenido">
      <!-- Lista del carrito -->
      <div class="col-lg-7">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead><tr><th>Peluche</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead>
              <tbody id="filas"></tbody>
            </table>
          </div>
          <div class="text-end fs-5 fw-bold mt-3">Total: <span id="total"></span></div>
        </div>
      </div>

      <!-- Datos de envío y pago -->
      <div class="col-lg-5">
        <form class="card p-3" id="form-compra">
          <h5>Datos de envío</h5>
          <div class="mb-2"><label class="form-label">Dirección</label>
            <input class="form-control" id="direccion" required minlength="5"></div>
          <div class="mb-3"><label class="form-label">Teléfono</label>
            <input class="form-control" id="telefono" required placeholder="5555-5555"></div>

          <h5>Forma de pago</h5>
          <div class="mb-2">
            <div class="form-check"><input class="form-check-input" type="radio" name="pago" id="p-tarjeta" value="tarjeta" checked>
              <label class="form-check-label" for="p-tarjeta">Tarjeta (simulado)</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="pago" id="p-contra" value="contra_entrega">
              <label class="form-check-label" for="p-contra">Contra entrega</label></div>
          </div>
          <div id="caja-tarjeta">
            <input class="form-control mb-2" id="t-numero" placeholder="Número de tarjeta (16 dígitos)" maxlength="19" inputmode="numeric" autocomplete="off">
            <div class="row g-2 mb-2">
              <div class="col"><input class="form-control" id="t-venc" placeholder="MM/AA" maxlength="5" autocomplete="off"></div>
              <div class="col"><input class="form-control" id="t-cvv" placeholder="CVV" maxlength="3" inputmode="numeric" autocomplete="off"></div>
            </div>
            <div class="form-text mb-2">Pago simulado: no se guarda la tarjeta. Una tarjeta que termina en 0000 se rechaza (para pruebas).</div>
          </div>
          <button class="btn btn-primary w-100" id="btn-comprar">Confirmar compra</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    async function iniciar() {
      const user = await cargarNav();
      if (!user) { location.href = '/login.html'; return; }
      if (user.rol === 'admin') { location.href = '/admin.html'; return; }
      await pintar();
    }

    async function pintar() {
      const { items, total } = await api('/api/carrito');
      $('vacio').classList.toggle('d-none', items.length > 0);
      $('contenido').classList.toggle('d-none', items.length === 0);
      $('total').textContent = q(total);

      $('filas').innerHTML = items.map(i => `
        <tr>
          <td>${esc(i.emoji)} ${esc(i.nombre)}</td>
          <td>${q(i.precio)}</td>
          <td><input type="number" class="form-control form-control-sm cantidad-input" min="1" max="${i.stock}"
                value="${i.cantidad}" data-id="${i.producto_id}"></td>
          <td>${q(i.precio * i.cantidad)}</td>
          <td><button class="btn btn-outline-danger btn-sm" data-del="${i.producto_id}">Quitar</button></td>
        </tr>`).join('');

      document.querySelectorAll('.cantidad-input').forEach(inp => inp.onchange = async () => {
        try { await api('/api/carrito/' + inp.dataset.id, 'PUT', { cantidad: Number(inp.value) }); }
        catch (e) { aviso(e.message, 'danger'); }
        pintar();
      });
      document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        await api('/api/carrito/' + b.dataset.del, 'DELETE');
        pintar();
      });
    }

    // Mostrar/ocultar campos de tarjeta
    document.querySelectorAll('input[name=pago]').forEach(r => r.onchange = () => {
      $('caja-tarjeta').classList.toggle('d-none', r.value !== 'tarjeta' || !r.checked);
    });

    $('form-compra').onsubmit = async e => {
      e.preventDefault();
      const metodo = document.querySelector('input[name=pago]:checked').value;
      const cuerpo = { direccion: $('direccion').value, telefono: $('telefono').value, metodo_pago: metodo };
      if (metodo === 'tarjeta') {
        cuerpo.tarjeta = { numero: $('t-numero').value, vencimiento: $('t-venc').value, cvv: $('t-cvv').value };
      }
      $('btn-comprar').disabled = true;
      try {
        const r = await api('/api/pedidos', 'POST', cuerpo);
        aviso(`¡Pedido #${r.pedido_id} realizado! Estado: ${r.estado}`);
        setTimeout(() => location.href = '/pedidos.html', 1200);
      } catch (err) {
        aviso(err.message, 'danger');
        $('btn-comprar').disabled = false;
        pintar(); // por si cambió el stock
      }
    };

    iniciar();
  </script>
</body>
</html>
