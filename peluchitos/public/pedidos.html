<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peluchitos - Mis pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-4">
    <h2 class="mb-3">Mis pedidos 📦</h2>
    <div id="lista"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function iniciar() {
      const user = await cargarNav();
      if (!user) { location.href = '/login.html'; return; }
      if (user.rol === 'admin') { location.href = '/admin.html'; return; }
      pintar();
    }

    async function pintar() {
      const pedidos = await api('/api/pedidos');
      const cont = document.getElementById('lista');
      if (!pedidos.length) {
        cont.innerHTML = '<div class="alert alert-info">Aún no tienes pedidos. <a href="/index.html">Ir al catálogo</a></div>';
        return;
      }
      cont.innerHTML = pedidos.map(p => `
        <div class="card p-3 mb-3">
          <div class="d-flex justify-content-between flex-wrap gap-2">
            <div><strong>Pedido #${p.id}</strong> <span class="text-muted small">${new Date(p.fecha).toLocaleString()}</span></div>
            <div>${badge(p.estado)}</div>
          </div>
          <ul class="mb-2 mt-2">
            ${p.items.map(i => `<li>${esc(i.emoji)} ${esc(i.nombre)} x${i.cantidad} — ${q(i.precio_unitario * i.cantidad)}</li>`).join('')}
          </ul>
          <div class="small text-muted">Envío a: ${esc(p.direccion)} · Pago: ${p.metodo_pago === 'tarjeta' ? 'Tarjeta' : 'Contra entrega'}</div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <strong>Total: ${q(p.total)}</strong>
            ${['Pendiente', 'Pagado'].includes(p.estado)
              ? `<button class="btn btn-outline-danger btn-sm" data-cancelar="${p.id}">Cancelar pedido</button>` : ''}
          </div>
        </div>`).join('');

      cont.querySelectorAll('[data-cancelar]').forEach(b => b.onclick = async () => {
        if (!confirm('¿Seguro que quieres cancelar este pedido?')) return;
        try {
          await api(`/api/pedidos/${b.dataset.cancelar}/cancelar`, 'PUT');
          aviso('Pedido cancelado. El stock fue devuelto.');
        } catch (e) { aviso(e.message, 'danger'); }
        pintar();
      });
    }
    iniciar();
  </script>
</body>
</html>
