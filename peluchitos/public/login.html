<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peluchitos - Ingresar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container py-4 auth-shell">
    <div class="auth-intro">
      <div class="auth-icon" aria-hidden="true">🧸</div>
      <span class="eyebrow">Tu rincón de ternura</span>
      <h1>Qué bonito verte aquí</h1>
      <p>Entra a tu cuenta. Tu próximo abrazo te espera.</p>
    </div>
    <div class="card p-4">
      <ul class="nav nav-pills nav-fill mb-3">
        <li class="nav-item"><button class="nav-link active" id="tab-login">Ingresar</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-registro">Crear cuenta</button></li>
      </ul>

      <form id="form-login">
        <div class="mb-3"><label class="form-label" for="l-email">Correo</label>
          <input type="email" class="form-control" id="l-email" autocomplete="username" placeholder="tu@correo.com" required></div>
        <div class="mb-3"><label class="form-label" for="l-pass">Contraseña</label>
          <input type="password" class="form-control" id="l-pass" autocomplete="current-password" placeholder="Tu contraseña" required></div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>

      <form id="form-registro" class="d-none">
        <div class="mb-3"><label class="form-label" for="r-nombre">Nombre</label>
          <input type="text" class="form-control" id="r-nombre" autocomplete="name" placeholder="¿Cómo te llamas?" required></div>
        <div class="mb-3"><label class="form-label" for="r-email">Correo</label>
          <input type="email" class="form-control" id="r-email" autocomplete="username" placeholder="tu@correo.com" required></div>
        <div class="mb-3"><label class="form-label" for="r-pass">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" class="form-control" id="r-pass" autocomplete="new-password" placeholder="Crea tu contraseña" minlength="6" required></div>
        <div class="mb-3"><label class="form-label" for="r-confirmar">Confirmar contraseña</label>
          <input type="password" class="form-control" id="r-confirmar" autocomplete="new-password" minlength="6" required></div>
        <button class="btn btn-primary w-100">Crear cuenta</button>
      </form>
    </div>
  </div>

  <a class="auth-back" href="/index.html">← Volver a la colección</a>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    cargarNav();
    const $ = id => document.getElementById(id);

    function mostrar(login) {
      $('form-login').classList.toggle('d-none', !login);
      $('form-registro').classList.toggle('d-none', login);
      $('tab-login').classList.toggle('active', login);
      $('tab-registro').classList.toggle('active', !login);
    }
    $('tab-login').onclick = () => mostrar(true);
    $('tab-registro').onclick = () => mostrar(false);

    function irADestino(user) {
      location.href = user.rol === 'admin' ? '/admin.html' : '/index.html';
    }

    $('form-login').onsubmit = async e => {
      e.preventDefault();
      try {
        const { user } = await api('/api/auth/login', 'POST', { email: $('l-email').value, password: $('l-pass').value });
        irADestino(user);
      } catch (err) { aviso(err.message, 'danger'); }
    };

    $('form-registro').onsubmit = async e => {
      e.preventDefault();
      if ($('r-pass').value !== $('r-confirmar').value) { aviso('Las contraseñas no coinciden.', 'danger'); return; }
      try {
        const { user } = await api('/api/auth/registro', 'POST', {
          nombre: $('r-nombre').value, email: $('r-email').value, password: $('r-pass').value,
          confirmarPassword: $('r-confirmar').value
        });
        irADestino(user);
      } catch (err) { aviso(err.message, 'danger'); }
    };
  </script>
</body>
</html>
